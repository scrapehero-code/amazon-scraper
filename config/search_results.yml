products:
    css: 'div[data-component-type="s-search-result"]'
    xpath: null
    multiple: true
    type: Text
    children:
        title:
            css: 'h2 span'
            xpath: null
            type: Text
        url:
            css: 'h2 a, a.a-link-normal.s-no-outline'
            xpath: null
            type: Link
        image:
            css: 'img.s-image'
            xpath: null
            type: Attribute
            attribute: src
        rating:
            css: 'span.a-icon-alt'
            xpath: null
            type: Text
        reviews:
            css: 'span.a-size-base.s-underline-text'
            xpath: null
            type: Text
        price:
            css: 'span.a-price span.a-offscreen'
            xpath: null
            type: Text