services:
  scraper:
    image: python:3.12-slim
    working_dir: /app
    restart: unless-stopped
    command: sh -c "pip install --no-cache-dir fastapi uvicorn selectorlib requests && uvicorn api:app --host 0.0.0.0 --port 8000"
    environment:
      - PYTHONUNBUFFERED=1
      - URL_DELAY=3     # seconds between two search URLs
      - COOLDOWN=60     # min seconds between two "Re-scrape all" clicks
    volumes:
      - ./api.py:/app/api.py:ro
      - ./searchresults.py:/app/searchresults.py:ro
      - ./config:/app/config:ro   # search_results_urls.json + search_results.yml
      - ./data:/app/data

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/main.js:/usr/share/nginx/html/main.js:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scraper