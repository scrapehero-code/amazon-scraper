server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Always serve fresh files
    add_header Cache-Control "no-store";

    # Static files (index.html, main.js, data/...)
    location / {
        try_files $uri =404;
    }

    # Forward /api/ to the scraper container (FastAPI)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $scraper http://scraper:8000;
        proxy_pass $scraper;
        proxy_read_timeout 60s;
    }
}